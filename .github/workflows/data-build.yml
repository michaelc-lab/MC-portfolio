# MC Portfolio — data build, stage 1 (runs on GitHub's servers, free). Takes ~10–15 minutes.
# Run it: GitHub → Actions → "Data build" → Run workflow.
# Writes data/fundamentals.json (public SEC + market data, nothing personal) and reports/data-build.md.
name: Data build
on:
  workflow_dispatch:
permissions:
  contents: write
