# MC Portfolio — data build, stage 1 (runs on GitHub's servers, free). Takes ~25 minutes.
# Runs by itself every weekday night. To run it now: GitHub → Actions → "Data build" → Run workflow.
# Writes data/fundamentals.json + data/scores.json (public SEC + market data, nothing personal) and reports/data-build.md.
name: Data build
on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 1-5"      # every weekday night, after the US market closes (23:17 UTC = 01:17 Israel)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          SEC_UA: ${{ vars.SEC_UA }}
        run: |
